      - name: Empaquetar Mi App con el motor
        run: |
          mkdir -p Payload
          
          APP_PATH=$(find build -name "MiApp.app" -type d | head -n 1)
          echo "App encontrada en: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          
          DYLIB_PATH=$(find motor_filza -name "FilzaApplySandboxExt.dylib" | head -n 1)
          if [ -z "$DYLIB_PATH" ]; then
            DYLIB_PATH=$(find motor_filza/.theos -name "*.dylib" | head -n 1)
          fi
          DYLIB_NAME=$(basename "$DYLIB_PATH")
          echo "Motor encontrado: $DYLIB_NAME"
          cp "$DYLIB_PATH" Payload/MiApp.app/
          
          insert_dylib --strip-codesig --all-yes "@executable_path/$DYLIB_NAME" Payload/MiApp.app/MiApp Payload/MiApp.app/MiApp_patched
          mv Payload/MiApp.app/MiApp_patched Payload/MiApp.app/MiApp
          
          echo "=== Verificacion: contenido del bundle ==="
          ls -la Payload/MiApp.app/
          echo "=== Verificacion: load commands del binario ==="
          otool -L Payload/MiApp.app/MiApp
          
          zip -qr MiApp_ConMotor.ipa Payload/
