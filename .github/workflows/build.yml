name: Compilar Mi App con Motor Filza
on: [push, workflow_dispatch]

jobs:
  build-my-app:
    runs-on: macos-14
    steps:
      - name: Clonar mi app
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Instalar dependencias
        run: |
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
          brew untap aws/tap 2>/dev/null || true
          brew install ldid make
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Compilar e instalar insert_dylib
        run: |
          git clone https://github.com/Tyilo/insert_dylib.git
          cd insert_dylib
          clang insert_dylib/main.c -o insert_dylib_tool
          sudo cp insert_dylib_tool /usr/local/bin/insert_dylib
          sudo chmod +x /usr/local/bin/insert_dylib
          cd ..

      - name: Clonar y compilar el motor FilzaSlop
        run: |
          git clone --recursive https://github.com/0xjohnnydev/FilzaSlop.git motor_filza
          cd motor_filza
          export SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          export TARGET=iphone:clang:latest:18.0
          make clean
          make package FINALPACKAGE=1
          cd ..
          echo "=== Dylibs compilados ==="
          find motor_filza -name "*.dylib" -type f
          if [ -z "$(find motor_filza -name '*.dylib' -type f)" ]; then
            echo "ERROR: No se genero ningun dylib del motor"
            exit 1
          fi

      - name: Compilar Mi App
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -fmodules \
            -framework UIKit \
            -framework Foundation \
            -miphoneos-version-min=14.0 \
            -o MiApp_bin \
            MiApp/main.m \
            MiApp/AppDelegate.m \
            MiApp/ViewController.m \
            MiApp/motor.m

      - name: Empaquetar Mi App con el motor
        run: |
          # Crear bundle
          rm -rf Payload MiApp.ipa
          mkdir -p Payload/MiApp.app
          cp MiApp_bin Payload/MiApp.app/MiApp
          chmod +x Payload/MiApp.app/MiApp
          cp MiApp/Info.plist Payload/MiApp.app/
          sed -i '' 's/$(EXECUTABLE_NAME)/MiApp/g' Payload/MiApp.app/Info.plist
          sed -i '' 's/$(PRODUCT_BUNDLE_IDENTIFIER)/com.xitfarge.app/g' Payload/MiApp.app/Info.plist
          sed -i '' 's/$(PRODUCT_NAME)/xitfarge/g' Payload/MiApp.app/Info.plist
          echo -n "APPL????" > Payload/MiApp.app/PkgInfo

          # Encontrar e inyectar el motor
          DYLIB=$(find motor_filza -name "*.dylib" -type f | head -1)
          echo "Motor encontrado: $DYLIB"
          DYLIB_NAME=$(basename "$DYLIB")
          cp "$DYLIB" Payload/MiApp.app/

          echo "=== Inyectando motor con insert_dylib ==="
          insert_dylib --strip-codesig --all-yes "@executable_path/$DYLIB_NAME" Payload/MiApp.app/MiApp Payload/MiApp.app/MiApp_patched
          mv Payload/MiApp.app/MiApp_patched Payload/MiApp.app/MiApp
          chmod +x Payload/MiApp.app/MiApp

          # Crear entitlements para que el motor pueda cargar
          cat > entitlements.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.app-sandbox</key>
            <false/>
            <key>com.apple.private.security.no-sandbox</key>
            <true/>
            <key>com.apple.private.memorystatus</key>
            <true/>
          </dict>
          </plist>
          PLIST

          # Firmar
          ldid -S entitlements.plist Payload/MiApp.app/MiApp

          echo "=== Contenido del bundle ==="
          ls -la Payload/MiApp.app/
          echo "=== Load commands ==="
          otool -L Payload/MiApp.app/MiApp | grep -i dylib || echo "Sin dylibs en load commands"
          echo "=== Entitlements ==="
          ldid -e Payload/MiApp.app/MiApp

          # Crear IPA
          zip -r MiApp.ipa Payload/
          ls -lh MiApp.ipa

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mi-App-Final
          path: MiApp.ipa
