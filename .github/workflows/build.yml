name: Compilar Mi App con Motor Filza
on: [push, workflow_dispatch]

jobs:
  build-my-app:
    runs-on: macos-latest
    steps:
      - name: Clonar mi app
        uses: actions/checkout@v4

      - name: Instalar dependencias base
        run: |
          brew install xcodegen ldid dpkg make
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> $GITHUB_PATH
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Compilar e instalar insert_dylib
        run: |
          git clone https://github.com/Tyilo/insert_dylib.git
          cd insert_dylib
          clang insert_dylib/main.c -o insert_dylib
          cp insert_dylib /usr/local/bin/insert_dylib
          chmod +x /usr/local/bin/insert_dylib
          cd ..

      - name: Generar proyecto Xcode con XcodeGen
        run: xcodegen generate

      - name: Clonar y compilar el motor FilzaSlop
        run: |
          git clone --recursive https://github.com/0xjohnnydev/FilzaSlop.git motor_filza
          cd motor_filza
          export SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          export TARGET=iphone:clang:latest:18.0
          make clean
          make package FINALPACKAGE=1
          cd ..

      - name: Compilar Mi App
        run: |
          xcodebuild clean build \
            -project MiApp.xcodeproj \
            -scheme MiApp \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empaquetar Mi App con el motor
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/MiApp.app Payload/
          
          cp motor_filza/.theos/obj/*.dylib Payload/MiApp.app/
          
          DYLIB_NAME=$(ls motor_filza/.theos/obj/*.dylib | head -n 1 | xargs basename)
          echo "Inyectando: $DYLIB_NAME"
          
          # Inyectar el motor y quitar la firma vieja (GBox la re-firmara)
          insert_dylib --strip-codesig --all-yes "@executable_path/$DYLIB_NAME" Payload/MiApp.app/MiApp Payload/MiApp.app/MiApp_patched
          mv Payload/MiApp.app/MiApp_patched Payload/MiApp.app/MiApp
          
          zip -qr MiApp_ConMotor.ipa Payload/

      - name: Subir IPA final
        uses: actions/upload-artifact@v4
        with:
          name: Mi-App-Final
          path: MiApp_ConMotor.ipa
