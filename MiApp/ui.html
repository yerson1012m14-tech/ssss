<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiFilza</title>
<style>
:root{--bg:#000;--card:#0d1210;--borde:#1d2a24;--acc:#22ff88;--txt:#eafff4;--mut:#7a8a82;--rojo:#ff5555}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:ui-monospace,Menlo,monospace;padding:30px 16px 90px;max-width:520px;margin:0 auto}
.screen{display:none}.screen.active{display:block;animation:fin .2s}
@keyframes fin{from{opacity:0}to{opacity:1}}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:22px}.pill{color:var(--acc);border:1px solid var(--borde);border-radius:999px;padding:8px 14px;font-size:12px}
.search{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--borde);border-radius:999px;padding:12px 16px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--txt);font:inherit}
.sec{color:var(--mut);font-size:11px;letter-spacing:2px;margin:16px 4px 8px}
.card{background:var(--card);border:1px solid var(--borde);border-radius:16px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:13px;
